services:
  simulador:
    build: ./simulador
    container_name: secasmart_simulador
    restart: unless-stopped
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      SIM_SPEED: ${SIM_SPEED:-1.0}
      SCENARIO: ${SCENARIO:-normal}
      ESPECIE: ${ESPECIE:-pino}
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2.0.15
    container_name: secasmart_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  postgres:
    image: postgres:15
    container_name: secasmart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secasmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secasmart}
      POSTGRES_DB: ${POSTGRES_DB:-secasmart}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secasmart} -d ${POSTGRES_DB:-secasmart}"]
      interval: 5s
      timeout: 3s
      retries: 10

  nodered:
    # Imagen oficial + nodo node-red-contrib-postgresql (ver nodered/Dockerfile)
    build: ./nodered
    container_name: secasmart_nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
      - ./nodered/flows.json:/data/flows.json
    environment:
      TZ: UTC
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-secasmart}
      POSTGRES_USER: ${POSTGRES_USER:-secasmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secasmart}
      # Las reglas de alerta calculan la curva esperada con la misma velocidad que el simulador.
      SIM_SPEED: ${SIM_SPEED:-1.0}
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.1.5
    container_name: secasmart_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data:
  nodered_data:
  grafana_data:
