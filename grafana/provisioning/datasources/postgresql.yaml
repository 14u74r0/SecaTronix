apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER:-secasmart}
    database: ${POSTGRES_DB:-secasmart}
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-secasmart}
    jsonData:
      sslmode: 'disable'
      postgresVersion: 1500
    isDefault: true
    editable: true
